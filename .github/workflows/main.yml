name: Native HTTP contract

on:
  workflow_dispatch:
    inputs:
      soak:
        description: Run the longer resource and restart checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install native test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev nginx

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
          bundler-cache: true

      # Spinel is a source-built compiler rather than a Ruby gem. Keep this
      # pinned to the compiler revision used to validate the contract suite.
      - uses: actions/checkout@v4
        with:
          repository: matz/spinel
          ref: 21cc20850adbdcd3fb9df832572240fee97533b5
          path: .ci/spinel

      - name: Build Spinel
        run: |
          make -C .ci/spinel deps
          make -C .ci/spinel
          echo "$GITHUB_WORKSPACE/.ci/spinel" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/.ci/spinel:$PATH"
          spinel --version
          spinel --version | grep -F '21cc2085'
          nginx -v

      - name: Run test suite
        run: bundle exec rake test

      - name: Run resource and restart soak tests
        if: ${{ inputs.soak }}
        run: bundle exec rake soak
